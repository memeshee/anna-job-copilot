[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-job-hunt-copilot"
version = "0.1.1"
description = "Executa for the job-hunt-copilot Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-job-hunt-copilot" = "job_hunt_copilot_plugin:main"

[tool.setuptools]
py-modules = ["job_hunt_copilot_plugin"]
